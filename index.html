<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Workout Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI'; margin: 0; padding: 0; }
  </style>
</head>
<body class="bg-black text-white">
  <div id="app"></div>

  <script>
    class WorkoutApp {
      constructor() {
        this.exerciseMap = {
          'Push-ups': 'push up',
          'High Knees': 'high knees',
          'Squats': 'squat',
          'Jump Squats': 'jump squat',
          'Plank': 'plank',
          'Squat Right Dumbbell': 'dumbbell squat',
          'Squat Left Dumbbell': 'dumbbell squat',
          'Suitcase Walk': 'farmer carry',
          'Deadbug': 'dead bug',
          'Bird Dog': 'bird dog',
          'Dumbbell RDL': 'dumbbell romanian deadlift',
          'Reverse Flies': 'reverse pec deck fly',
          'Bent Over Rows': 'bent-over barbell row',
          'Shoulder Press': 'dumbbell shoulder press',
          'Russian Twist': 'russian twist',
          'Standing Marches': 'marching in place',
          'Wood Chop': 'cable wood chop',
          'Overhead Press': 'overhead press',
          'Bulgarian Split Squats': 'bulgarian split squat',
          'Lunges': 'forward lunge',
          'Chest Press': 'dumbbell bench press',
          'Overhead Extension': 'dumbbell tricep extension',
          'Bicep Curls': 'dumbbell bicep curl',
          'Glute Bridge': 'glute bridge',
          'Dumbbell Pullover': 'dumbbell pullover'
        };
        
        this.exercises = Object.keys(this.exerciseMap).map((name, id) => ({
          id: id + 1,
          name: name,
          video: null,
          apiName: this.exerciseMap[name]
        }));
        
        this.screen = 'home';
        this.workout = [];
        this.savedWorkouts = JSON.parse(localStorage.getItem('workouts') || '[]');
        this.workoutName = '';
        this.isRunning = false;
        this.currentIdx = 0;
        this.timeLeft = 0;
        this.isWorking = true;
        this.audioCtx = null;
        this.timer = null;
        
        this.init();
      }

      async init() {
        document.addEventListener('click', () => {
          if (!this.audioCtx) {
            try {
              this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
          }
        }, { once: true });
        
        this.render();
      }

      async fetchExerciseVideo(apiName) {
        try {
          // נסיון ראשון - ExerciseDB (עדיף)
          const url = `https://exercisedb.io/api/exercises?name=${encodeURIComponent(apiName)}`;
          console.log(`🔍 מחפש: ${url}`);
          
          const response = await fetch(url, {
            mode: 'cors',
            headers: { 'Accept': 'application/json' }
          });
          
          if (response.ok) {
            const data = await response.json();
            if (data && data.length > 0 && data[0].gifUrl) {
              console.log(`✅ ExerciseDB: ${apiName}`);
              return data[0].gifUrl;
            }
          }
          console.log(`❌ ExerciseDB לא מצא: ${apiName}`);
        } catch (e) {
          console.log(`⚠️ ExerciseDB שגיאה: ${e.message}`);
        }
        
        return null;
      }

      playBeep(freq = 800, dur = 200) {
        if (!this.audioCtx) return;
        try {
          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();
          osc.connect(gain);
          gain.connect(this.audioCtx.destination);
          osc.frequency.value = freq;
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.3, this.audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + dur / 1000);
          osc.start(this.audioCtx.currentTime);
          osc.stop(this.audioCtx.currentTime + dur / 1000);
        } catch (e) {}
      }

      startWorkout() {
        if (this.workout.length === 0) return;
        if (!this.isRunning) {
          this.isWorking = true;
          this.currentIdx = 0;
          this.timeLeft = this.workout[0].work;
        }
        this.isRunning = !this.isRunning;
        
        if (this.isRunning) {
          this.timer = setInterval(() => this.tick(), 1000);
        } else {
          clearInterval(this.timer);
        }
        this.render();
      }

      tick() {
        if (this.timeLeft <= 3 && this.timeLeft > 0) {
          this.playBeep(this.timeLeft === 3 ? 600 : this.timeLeft === 2 ? 700 : 800, 150);
        }
        
        if (this.timeLeft <= 1) {
          if (this.isWorking) {
            this.isWorking = false;
            this.playBeep(1000, 200);
            this.timeLeft = this.workout[this.currentIdx].rest;
          } else {
            if (this.currentIdx < this.workout.length - 1) {
              this.currentIdx++;
              this.isWorking = true;
              this.playBeep(1200, 200);
              this.timeLeft = this.workout[this.currentIdx].work;
            } else {
              this.isRunning = false;
              clearInterval(this.timer);
              this.playBeep(1200, 300);
              this.render();
              return;
            }
          }
        } else {
          this.timeLeft--;
        }
        this.render();
      }

      reset() {
        clearInterval(this.timer);
        this.isRunning = false;
        this.currentIdx = 0;
        this.isWorking = true;
        this.timeLeft = 0;
        this.render();
      }

      saveWorkout() {
        if (!this.workoutName.trim() || this.workout.length === 0) {
          alert('תן שם לרוטינה!');
          return;
        }
        const w = {
          id: Date.now(),
          name: this.workoutName,
          exercises: this.workout,
          createdAt: new Date().toLocaleDateString('he-IL')
        };
        this.savedWorkouts.push(w);
        localStorage.setItem('workouts', JSON.stringify(this.savedWorkouts));
        this.workoutName = '';
        this.workout = [];
        this.screen = 'home';
        this.render();
      }

      loadWorkout(w) {
        this.workout = w.exercises.map(ex => ({
          ...ex,
          video: ex.video || null
        }));
        this.currentIdx = 0;
        this.isRunning = false;
        this.isWorking = true;
        this.timeLeft = 0;
        this.screen = 'workout';
        this.render();
      }

      deleteWorkout(id) {
        this.savedWorkouts = this.savedWorkouts.filter(w => w.id !== id);
        localStorage.setItem('workouts', JSON.stringify(this.savedWorkouts));
        this.render();
      }

      addExercise(ex) {
        this.workout.push({
          id: Date.now(),
          ...ex,
          work: 30,
          rest: 10
        });
        this.render();
      }

      removeExercise(id) {
        this.workout = this.workout.filter(e => e.id !== id);
        this.render();
      }

      updateTime(id, field, val) {
        const ex = this.workout.find(e => e.id === id);
        if (ex) ex[field] = parseInt(val) || 0;
        this.render();
      }

      render() {
        const app = document.getElementById('app');
        
        if (this.screen === 'home') {
          app.innerHTML = `
            <div class="min-h-screen bg-gradient-to-b from-indigo-900 to-gray-900 p-6">
              <h1 class="text-5xl font-black text-center mb-12 mt-12">💪 Workout Pro</h1>
              ${this.savedWorkouts.length === 0 ? `
                <div class="max-w-2xl mx-auto bg-gray-800 rounded-xl p-8 text-center mb-6">
                  <p class="text-xl mb-6">עדיין אין רוטינות</p>
                  <button onclick="app.goToBuild()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-lg text-lg">➕ בנה רוטינה</button>
                </div>
              ` : `
                <div class="max-w-2xl mx-auto space-y-4 mb-6">
                  ${this.savedWorkouts.map(w => `
                    <div class="bg-gradient-to-r from-indigo-800 to-purple-800 p-6 rounded-xl">
                      <h3 class="font-bold text-xl mb-2">${w.name}</h3>
                      <p class="text-sm text-gray-300 mb-4">${w.exercises.length} תרגילים</p>
                      <div class="flex gap-3">
                        <button onclick="app.load(${w.id})" class="flex-1 bg-green-600 hover:bg-green-700 py-2 px-4 rounded-lg font-bold">▶️ התחל</button>
                        <button onclick="app.delete(${w.id})" class="bg-red-600 hover:bg-red-700 py-2 px-4 rounded-lg font-bold">🗑️</button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
              <div class="max-w-2xl mx-auto">
                <button onclick="app.goToBuild()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg text-lg">➕ רוטינה חדשה</button>
              </div>
            </div>
          `;
        } else if (this.screen === 'build') {
          app.innerHTML = `
            <div class="min-h-screen bg-gradient-to-b from-gray-900 to-black p-6">
              <div class="max-w-4xl mx-auto">
                <div class="flex items-center gap-4 mb-8">
                  <button onclick="app.goHome()" class="bg-gray-700 p-2 rounded-lg">🏠</button>
                  <h1 class="text-3xl font-bold">בנה רוטינה</h1>
                </div>
                <input id="workoutName" type="text" placeholder="שם הרוטינה" value="${this.workoutName}" onchange="app.setName(this.value)" class="w-full p-3 bg-gray-700 rounded-lg mb-8 text-white" />
                <div class="mb-8">
                  <h2 class="text-2xl font-bold mb-6">בחר תרגילים:</h2>
                  <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                    ${this.exercises.map(ex => `
                      <button onclick="app.addEx(${ex.id})" class="bg-gray-800 hover:bg-gray-700 rounded-lg p-3 font-semibold text-xs transition hover:scale-105">${ex.name}</button>
                    `).join('')}
                  </div>
                </div>
                ${this.workout.length > 0 ? `
                  <div class="bg-gray-800 p-6 rounded-xl">
                    <h2 class="text-2xl font-bold mb-4">בחרת (${this.workout.length}):</h2>
                    <div class="space-y-3 max-h-80 overflow-y-auto mb-6">
                      ${this.workout.map((ex, idx) => `
                        <div class="bg-gray-700 p-4 rounded-lg">
                          <div class="flex justify-between items-start mb-2">
                            <p class="font-semibold">${idx + 1}. ${ex.name}</p>
                            <button onclick="app.removeEx(${ex.id})" class="bg-red-600 hover:bg-red-700 p-1 rounded text-sm">🗑️</button>
                          </div>
                          <div class="flex gap-4">
                            <div>
                              <label class="text-xs text-gray-400">עבודה</label>
                              <input type="number" value="${ex.work}" onchange="app.updateTime(${ex.id}, 'work', this.value)" class="w-16 p-1 bg-gray-600 rounded text-white text-center" min="1" />
                            </div>
                            <div>
                              <label class="text-xs text-gray-400">מנוחה</label>
                              <input type="number" value="${ex.rest}" onchange="app.updateTime(${ex.id}, 'rest', this.value)" class="w-16 p-1 bg-gray-600 rounded text-white text-center" min="0" />
                            </div>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                    <button onclick="app.save()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg mb-3">💾 שמור</button>
                    <button onclick="app.clearWorkout()" class="w-full bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 rounded-lg">🔄 נקה</button>
                  </div>
                ` : ''}
              </div>
            </div>
          `;
        } else if (this.screen === 'workout') {
          const current = this.workout[this.currentIdx];
          const next = this.currentIdx < this.workout.length - 1 ? this.workout[this.currentIdx + 1] : null;
          
          // טעינת הסרטון אם עדיין לא טעון
          if (!current.video && current.apiName) {
            this.fetchExerciseVideo(current.apiName).then(video => {
              if (video) {
                current.video = video;
                this.render();
              }
            });
          }
          
          app.innerHTML = `
            <div class="fixed inset-0 bg-black flex flex-col">
              <div class="absolute inset-0 overflow-hidden bg-gradient-to-b from-gray-900 to-black flex items-center justify-center">
                ${current.video ? `
                  <img src="${current.video}" alt="${current.name}" class="w-full h-full object-cover" onerror="this.style.display='none'" />
                ` : `
                  <div class="text-center">
                    <p class="text-2xl mb-4">🔄 טוען סרטון...</p>
                    <p class="text-gray-400">${current.name}</p>
                  </div>
                `}
              </div>
              <div class="relative z-10 flex justify-between items-center p-4 bg-black bg-opacity-40">
                <button onclick="app.goHome()" class="bg-gray-900 bg-opacity-80 p-2 rounded-lg">🏠</button>
                <div class="text-center flex-1">
                  <h1 class="text-xl font-bold drop-shadow-lg">${current.name}</h1>
                  <p class="text-xs text-gray-300">תרגיל ${this.currentIdx + 1}/${this.workout.length}</p>
                </div>
                <div class="w-10"></div>
              </div>
              <div class="absolute top-24 right-6 z-20">
                <div class="bg-black bg-opacity-70 rounded-2xl p-4 text-center border-2 border-green-500">
                  <div class="text-5xl font-black font-mono">${String(Math.floor(this.timeLeft / 60)).padStart(2, '0')}:${String(this.timeLeft % 60).padStart(2, '0')}</div>
                  <div class="text-2xl font-black mt-2">${this.isWorking ? '🔥' : '😤'}</div>
                </div>
              </div>
              ${this.isWorking && this.timeLeft <= 3 && next ? `
                <div class="absolute bottom-24 right-6 z-20 bg-black bg-opacity-80 p-4 rounded-2xl w-36 border-2 border-yellow-400">
                  <p class="text-sm font-bold text-yellow-300 text-center">👉 הבא<br/>${next.name}</p>
                </div>
              ` : ''}
              <div class="absolute bottom-0 w-full bg-black bg-opacity-60 border-t border-gray-700 z-10 p-4">
                <div class="max-w-4xl mx-auto">
                  <div class="mb-4">
                    <div class="flex justify-between mb-2 text-sm text-gray-300">
                      <span>התקדמות</span>
                      <span>${this.currentIdx + 1}/${this.workout.length}</span>
                    </div>
                    <div class="w-full bg-gray-700 rounded-full h-2">
                      <div class="bg-green-500 h-2 rounded-full" style="width: ${((this.currentIdx + 1) / this.workout.length) * 100}%"></div>
                    </div>
                  </div>
                  <div class="flex gap-4 justify-center">
                    <button onclick="app.startWorkout()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg">${this.isRunning ? '⏸️ עצור' : '▶️ התחל'}</button>
                    <button onclick="app.reset()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-lg">🔄 אפס</button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }
      }

      goHome() { this.screen = 'home'; clearInterval(this.timer); this.isRunning = false; this.render(); }
      goToBuild() { this.screen = 'build'; this.workout = []; this.workoutName = ''; this.render(); }
      setName(val) { this.workoutName = val; }
      addEx(id) { const ex = this.exercises.find(e => e.id === id); if (ex) this.addExercise(JSON.parse(JSON.stringify(ex))); }
      removeEx(id) { this.removeExercise(id); }
      updateTime(id, field, val) { this.updateTime(id, field, val); }
      save() { this.saveWorkout(); }
      clearWorkout() { this.workout = []; this.render(); }
      load(id) { const w = this.savedWorkouts.find(x => x.id === id); if (w) this.loadWorkout(w); }
      delete(id) { this.deleteWorkout(id); }
    }

    const app = new WorkoutApp();
    window.app = app;
  </script>

  <link rel="manifest" href="data:application/json,{%22name%22:%22Workout%20Pro%22,%22short_name%22:%22Workout%22,%22display%22:%22standalone%22,%22start_url%22:%22/%22,%22background_color%22:%22%23000000%22}">
</body>
</html>
