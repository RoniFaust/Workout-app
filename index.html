<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Workout Pro</title>
  <meta name="theme-color" content="#5b21b6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout Pro">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
    }

    .container { max-width: 800px; margin: 0 auto; padding: 20px; }

    h1 { text-align: center; margin: 30px 0; font-size: 2.2em; }
    h2 { font-size: 1.4em; margin: 20px 0 12px 0; }

    button {
      background: #5b21b6;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      font-weight: bold;
      margin: 5px;
      transition: all 0.2s;
    }
    button:active { transform: scale(0.97); }
    button.danger { background: #dc2626; }
    button.success { background: #16a34a; }

    input {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: white;
      font-size: 1em;
      width: 100%;
      margin: 10px 0;
    }

    .workout-item {
      background: #1a1a1a;
      padding: 15px;
      border-radius: 8px;
      margin: 10px 0;
      border-right: 3px solid #7c3aed;
    }
    .workout-item.just-moved {
      animation: moveFlash 0.8s ease;
    }
    @keyframes moveFlash {
      0% { background: #7c3aed; border-right-color: #fbbf24; }
      100% { background: #1a1a1a; border-right-color: #7c3aed; }
    }
    .drag-handle {
      font-size: 1.4em;
      color: #777;
      cursor: grab;
      padding: 4px 6px;
      flex-shrink: 0;
      touch-action: none;
    }
    .workout-item.dragging { opacity: 0.4; }
    .workout-item.drag-over { border-top: 3px solid #fbbf24; }

    .workout-item-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .workout-item-header img { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: #333; }
    .workout-item-header .thumb-placeholder {
      width: 56px; height: 56px; border-radius: 6px; flex-shrink: 0;
      background: #333; display: flex; align-items: center; justify-content: center; font-size: 0.65em; color: #888; text-align: center;
    }
    .workout-item-header .name { flex: 1; }

    .times { display: flex; gap: 15px; margin-top: 10px; }
    .bulk-selection-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: #2d1b4e;
      border: 1px solid #7c3aed;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 0.85em;
    }
    .bulk-selection-bar.hidden { display: none; }
    .workout-item.bulk-selected { outline: 2px solid #7c3aed; }

    .bulk-time-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #161616;
      border: 1px dashed #444;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
    }
    .bulk-time-row .time-input input { margin: 0; }
    .bulk-time-row button { flex-shrink: 0; padding: 10px 14px; font-size: 0.85em; }
    .time-input { flex: 1; }
    .time-input label { font-size: 0.8em; color: #999; display: block; margin-bottom: 4px; }
    .time-input input { width: 100%; margin: 0; text-align: center; }

    .button-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }

    .screen { display: none; }
    .screen.active { display: block; }

    .workouts-grid { display: grid; gap: 15px; }
    .workout-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; border-radius: 10px; }
    .workout-card h3 { margin-bottom: 8px; }

    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .chip {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #444;
      background: #1a1a1a;
      color: #ccc;
      font-size: 0.8em;
      margin: 0;
    }
    .chip.active { background: #7c3aed; border-color: #7c3aed; color: white; font-weight: bold; }
    .filter-row select {
      flex: 1;
      padding: 10px 8px;
      border-radius: 5px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: white;
      font-size: 0.85em;
    }

    .exercise-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      margin: 15px 0;
    }
    .exercise-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 8px 6px;
      font-size: 0.72em;
      line-height: 1.25;
      text-align: center;
    }
    .exercise-btn img { width: 100%; aspect-ratio: 1; border-radius: 6px; object-fit: cover; background: #333; }
    .exercise-btn .thumb-empty {
      width: 100%; aspect-ratio: 1; border-radius: 6px; background: #2a2a2a;
      display: flex; align-items: center; justify-content: center; font-size: 1.3em;
    }

    .workout-screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      z-index: 1000;
    }

    .media-wrap {
      flex: 1;
      position: relative;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .media-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* Force the embedded YouTube player to fill the screen and crop nicely,
       regardless of whether the source video is portrait or landscape. */
    #ytPlayerHost { overflow: hidden; }
    #ytPlayerHost iframe {
      position: absolute;
      top: 50%; left: 50%;
      width: 100vw; height: 56.25vw; /* 16:9 sized by width */
      min-width: 177.78vh; min-height: 100vh; /* 16:9 sized by height, whichever is larger wins */
      transform: translate(-50%, -50%);
      border: 0;
    }
    .media-fallback { color: #888; text-align: center; padding: 20px; font-size: 0.9em; }

    .next-up {
      position: absolute;
      bottom: 90px;
      left: 16px;
      z-index: 20;
      background: rgba(0,0,0,0.85);
      border: 2px solid #fbbf24;
      border-radius: 14px;
      padding: 10px 14px;
      max-width: 140px;
      text-align: center;
    }
    .next-up.hidden { display: none; }
    .next-up img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; margin-bottom: 6px; }
    .next-up p { font-size: 0.75em; color: #fbbf24; font-weight: bold; }

    .full-list-overlay {
      position: fixed; inset: 0; z-index: 3000;
      background: rgba(0,0,0,0.9);
      display: flex; align-items: flex-end;
    }
    .full-list-overlay.hidden { display: none; }
    .full-list-panel {
      background: #111; width: 100%; max-height: 75vh; overflow-y: auto;
      border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)) 16px;
    }
    .full-list-item {
      padding: 10px 12px; border-radius: 8px; margin-bottom: 6px;
      display: flex; justify-content: space-between; align-items: center;
      background: #1a1a1a; font-size: 0.9em;
    }
    .full-list-item.current { background: #7c3aed; font-weight: bold; }
    .full-list-item.done { opacity: 0.4; text-decoration: line-through; }

    .rest-screen {
      text-align: center;
      color: #93c5fd;
    }
    .rest-screen .big-emoji { font-size: 4em; }

    .stats-bar { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 20px 0; }
    .stat-pill {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85em;
    }
    .achievement-card {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 10px;
      padding: 14px;
      margin: 8px 0;
      text-align: right;
      animation: pop 0.4s ease;
    }
    .achievement-card .emoji { font-size: 1.8em; margin-left: 10px; }
    @keyframes pop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .manual-search {
      background: #111;
      border: 1px dashed #555;
      border-radius: 8px;
      padding: 10px;
      margin: 8px 0;
    }
    .manual-search.hidden { display: none; }
    .manual-search input { margin: 0; }
    .search-result {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #222;
      border-radius: 8px;
      padding: 6px;
      margin: 6px 0;
      cursor: pointer;
    }
    .search-result:active { background: #333; }
    .search-result img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
    .search-result span { font-size: 0.8em; }

    .top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
    }
    .top-bar .title { text-align: center; flex: 1; }
    .top-bar .title h1 { margin: 0; font-size: 1.1em; text-shadow: 0 1px 4px #000; }
    .top-bar .title p { font-size: 0.75em; color: #ddd; margin-top: 2px; }

    .timer-box {
      position: absolute;
      bottom: 90px;
      right: 16px;
      z-index: 20;
      background: rgba(0,0,0,0.8);
      padding: 14px 18px;
      border-radius: 14px;
      border: 2px solid #22c55e;
      text-align: center;
      min-width: 100px;
    }
    .timer-box .timer-display { font-size: 2.4em; font-weight: bold; font-family: monospace; }
    .timer-box .emoji { font-size: 1.6em; margin-top: 4px; }

    .workout-info { background: rgba(0,0,0,0.95); padding: 12px 16px 4px 16px; }
    .progress-bar { width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; background: #22c55e; transition: width 0.3s; }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      padding: 12px 15px 18px 15px;
      background: rgba(0,0,0,0.95);
    }

    #debugPanel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-height: 35vh;
      overflow-y: auto;
      background: #000;
      border-top: 2px solid #7c3aed;
      font-family: monospace;
      font-size: 0.7em;
      padding: 8px 8px 8px 50px;
      z-index: 5000;
      direction: ltr;
      text-align: left;
    }
    #debugPanel.hidden { display: none; }
    #debugPanel .line { padding: 2px 0; border-bottom: 1px solid #222; word-break: break-all; }
    #debugPanel .ok { color: #4ade80; }
    #debugPanel .err { color: #f87171; }
    #debugToggle {
      position: fixed;
      bottom: 10px; left: 10px;
      z-index: 5001;
      background: #7c3aed;
      color: white;
      border-radius: 50%;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1em;
      border: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Home Screen -->
    <div id="homeScreen" class="screen active">
      <div class="container">
        <h1>💪 Workout Pro</h1>
        <div class="stats-bar" id="homeStatsBar"></div>
        <div id="workoutsList" class="workouts-grid"></div>
        <button class="success" onclick="goToBuild()" style="width: 100%; font-size: 1.15em; padding: 15px;">➕ רוטינה חדשה</button>
      </div>
    </div>

    <!-- Build Screen -->
    <div id="buildScreen" class="screen">
      <div class="container">
        <button onclick="goHome()">🏠 חזרה</button>
        <button onclick="clearMediaCache()" style="background:#555;">🧹 נקה מטמון תמונות</button>
        <h1 id="buildTitle">בניית רוטינה</h1>
        <input type="text" id="workoutNameInput" placeholder="שם הרוטינה" oninput="state.workoutName = this.value">
        <h2>בחירת תרגילים:</h2>
        <div class="filter-row" id="areaChips"></div>
        <div class="filter-row" id="positionChips"></div>
        <div class="filter-row" id="stretchChips"></div>
        <button onclick="clearFilters()" style="background:#374151; font-size:0.8em; padding:6px 12px;">🔄 נקה סינון</button>
        <div class="exercise-grid" id="exercisesGrid"></div>
        <h2>בחרת:</h2>
        <div id="totalTimeBuild" style="color:#93c5fd; font-size:0.9em; margin-bottom:8px;"></div>
        <div id="bulkSelectionBar" class="bulk-selection-bar hidden">
          <span id="bulkSelectionCount"></span>
          <button onclick="moveSelectedBlock(-1)" style="margin:0; background:#374151; padding:6px 10px;">▲ הזז</button>
          <button onclick="moveSelectedBlock(1)" style="margin:0; background:#374151; padding:6px 10px;">▼ הזז</button>
          <button onclick="clearBulkSelect()" style="margin:0; background:#374151; padding:6px 10px;">✕ נקה בחירה</button>
        </div>
        <div class="bulk-time-row">
          <div class="time-input">
            <label id="bulkWorkLabel">עבודה לכולם (שנ')</label>
            <input type="number" id="bulkWork" min="1" placeholder="למשל 60">
          </div>
          <div class="time-input">
            <label id="bulkRestLabel">מנוחה לכולם (שנ')</label>
            <input type="number" id="bulkRest" min="0" placeholder="למשל 30">
          </div>
          <button class="success" id="bulkApplyBtn" onclick="applyBulkTimes()" style="margin:0;">החל על הכל</button>
        </div>
        <p style="font-size:0.75em; color:#888; margin:-8px 0 10px 0;">סמני ☑ תרגילים ספציפיים כדי להחיל רק עליהם — אחרת זה יחול על כולם</p>
        <div id="selectedExercises" style="min-height: 50px;"></div>
        <div class="button-group">
          <button class="success" onclick="saveWorkout()" style="flex: 1;">💾 שמור</button>
          <button class="danger" onclick="clearWorkout()" style="flex: 1;">🔄 נקה</button>
        </div>
      </div>
    </div>

    <!-- Workout Screen -->
    <div id="workoutScreen" class="screen">
      <div class="workout-screen">
        <div class="media-wrap" id="mediaWrap"></div>
        <div id="nextUpBox" class="next-up hidden"></div>
        <div class="top-bar">
          <button onclick="goHome()">🏠</button>
          <div class="title">
            <h1 id="exerciseName"></h1>
            <p id="exerciseNumber"></p>
          </div>
          <button onclick="toggleFullList()">📋</button>
        </div>
        <div id="fullListOverlay" class="full-list-overlay hidden">
          <div class="full-list-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <h2 style="margin:0;">כל התרגילים</h2>
              <button onclick="toggleFullList()" style="margin:0; background:#374151;">✕ סגור</button>
            </div>
            <div id="fullListContent"></div>
          </div>
        </div>
        <div class="timer-box">
          <div class="timer-display" id="timerDisplay">00:00</div>
          <div class="emoji" id="workingEmoji">🔥</div>
        </div>
        <div class="workout-info">
          <p id="totalTimeLeft" style="text-align:center; font-size:0.8em; color:#93c5fd; margin-bottom:4px;"></p>
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="controls" style="flex-wrap: wrap;">
          <button class="success" onclick="toggleWorkout()" id="startBtn" style="flex: 1 1 100%;">▶️ התחל</button>
          <button onclick="restartCurrentExercise()" style="flex: 1; background:#374151; font-size:0.85em;">🔁 מחדש</button>
          <button onclick="skipPhase()" style="flex: 1; background:#0891b2; font-size:0.85em;">⏭️ דלג</button>
          <button class="danger" onclick="resetWorkout()" style="flex: 1; font-size:0.85em;">🔄 אפס הכל</button>
        </div>
      </div>
    </div>

    <!-- Preview Screen -->
    <div id="previewScreen" class="screen">
      <div class="container">
        <button onclick="goHome()">🏠 חזרה</button>
        <h1 id="previewTitle"></h1>
        <p id="previewMeta" style="color:#93c5fd; margin-bottom:15px;"></p>
        <div id="previewList"></div>
        <div class="button-group" style="margin-top:20px;">
          <button onclick="editWorkout(previewingWorkoutId)" style="flex:1; background:#374151;">✏️ ערוך רוטינה</button>
          <button class="success" onclick="loadWorkout(previewingWorkoutId)" style="flex:1;">▶️ התחל אימון זה</button>
        </div>
      </div>
    </div>

    <!-- Complete Screen -->
    <div id="completeScreen" class="screen">
      <div class="container" style="text-align:center; padding-top: 60px;">
        <div style="font-size: 4em;">🎉</div>
        <h1>כל הכבוד!</h1>
        <p id="completeSummary" style="color:#aaa; margin-bottom: 25px;"></p>

        <div class="stats-bar" style="justify-content:center; margin-bottom: 25px;">
          <div class="stat-pill">📅 השבוע: <span id="completeStreak"></span></div>
          <div class="stat-pill">💪 סה"כ: <span id="completeTotal"></span> אימונים</div>
        </div>

        <div id="newAchievements"></div>

        <button class="success" onclick="goHome()" style="width:100%; font-size:1.15em; padding:15px; margin-top:20px;">חזרה הביתה</button>
      </div>
    </div>

    <!-- Workout Log Screen -->
    <div id="logScreen" class="screen">
      <div class="container">
        <button onclick="goHome()">🏠 חזרה</button>
        <h1>יומן אימונים</h1>
        <div id="logContent"></div>
      </div>
    </div>
  </div>

  <button id="debugToggle" onclick="toggleDebug()">🐞</button>
  <div id="debugPanel" class="hidden"></div>

  <script>
    // ===== On-screen debug log (since mobile Chrome DevTools are hard to reach) =====
    function toggleDebug() {
      document.getElementById('debugPanel').classList.toggle('hidden');
    }
    function debugLog(msg, isError) {
      const panel = document.getElementById('debugPanel');
      const line = document.createElement('div');
      line.className = 'line ' + (isError ? 'err' : 'ok');
      const time = new Date().toLocaleTimeString('en-GB');
      line.textContent = `[${time}] ${msg}`;
      panel.appendChild(line);
      panel.scrollTop = panel.scrollHeight;
      if (isError) panel.classList.remove('hidden');
    }

    // ===== WorkoutX API =====
    // Note: this key is visible in the page source since this is a public static site.
    // Fine for a free-tier personal-use key; just don't reuse this key for anything sensitive.
    const API_KEY = 'wx_27773376362414473df72b0c0396ddb96501dda934ef964ffbfc7abe';
    const API_BASE = 'https://api.workoutxapp.com/v1';

    // ===== EXERCISE LIBRARY - search terms sent to WorkoutX's fuzzy name search =====
    // Body-area categories
    const AREAS = {
      glutes: 'ישבן וירך אחורית',
      back: 'גב, שכמות ויציבה',
      core: 'בטן וליבה',
      upper_body: 'פלג גוף עליון (חזה, כתפיים וזרועות)',
      chest: 'חזה',
      shoulders: 'כתפיים',
      arms: 'זרועות'
    };
    // Body-position categories
    const POSITIONS = {
      standing: 'עמידה חופשית',
      standing_support: 'עמידה עם עזרים',
      sitting: 'ישיבה',
      couch: 'עם ספה/מיטה',
      lying_back: 'שכיבה על הגב',
      hands_knees: 'עמידת שש',
      lying_front: 'שכיבה על הבטן'
    };
    // Stretch type - only set for stretches, undefined for regular exercises
    const STRETCH_TYPES = {
      dynamic: '🔥 חימום דינמי',
      static: '🧘 מתיחות שחרור'
    };

    const EXERCISES = [
      { id: 13, name: 'Bent Over Rows', search: 'bent over row', equipment: 'dumbbell', youtubeId: 'iCM5U0_b9Mg', start: 60, end: 106, areas: ['back'], positions: ['standing_support'] },
      { id: 23, name: 'Bicep Curls', search: 'bicep curl', equipment: 'dumbbell', youtubeId: 'uj001FhllVU', areas: ['upper_body', 'arms'], positions: ['standing', 'sitting'] },

      // ===== Stretches - dynamic (before workout) / static (after workout) =====
      { id: 44, name: 'חיבוק ברכיים לחזה', search: 'knee to chest stretch', youtubeId: 'yVy4L0CGbyQ', positions: ['lying_back'], stretchType: 'static' },

      { id: 47, name: 'תנוחת הילד', search: 'childs pose', youtubeId: '_ZX_zTOBgp8', positions: ['hands_knees'], stretchType: 'static' }
    ];

    // ===== Media fetching (with caching so we don't burn quota) =====
    const mediaCache = {};
    try {
      Object.assign(mediaCache, JSON.parse(localStorage.getItem('gifCache') || '{}'));
    } catch (e) {}
    function persistCache() {
      try { localStorage.setItem('gifCache', JSON.stringify(mediaCache)); } catch (e) {}
    }

    function formatTime(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function formatDuration(totalSeconds) {
      const mins = Math.round(totalSeconds / 60);
      if (mins < 60) return `${mins} דקות`;
      const hours = Math.floor(mins / 60);
      const remMins = mins % 60;
      return remMins ? `${hours} שעות ו-${remMins} דקות` : `${hours} שעות`;
    }

    function withKey(url) {
      const sep = url.includes('?') ? '&' : '?';
      return `${url}${sep}api-key=${API_KEY}`;
    }

    async function queryWorkoutX(searchTerm, equipment) {
      let url = `${API_BASE}/exercises?name=${encodeURIComponent(searchTerm)}&sortMethod=popularityRank&sortOrder=ascending&limit=5`;
      if (equipment) url += `&equipment=${encodeURIComponent(equipment)}`;
      const res = await fetch(url, { headers: { 'X-WorkoutX-Key': API_KEY } });
      if (!res.ok) return { ok: false, status: res.status, list: [] };
      const raw = await res.json();
      const list = Array.isArray(raw) ? raw : (Array.isArray(raw.data) ? raw.data : []);
      return { ok: true, list };
    }

    async function fetchExerciseMedia(searchTerm, equipment) {
      const cacheKey = searchTerm + '|' + (equipment || '');
      if (mediaCache[cacheKey] !== undefined) return mediaCache[cacheKey];
      debugLog(`מחפש: "${searchTerm}"${equipment ? ' (מעדיף ' + equipment + ')' : ''}...`);
      try {
        let r = await queryWorkoutX(searchTerm, equipment);
        if (r.ok && r.list.length === 0 && equipment) {
          debugLog(`אין תוצאה עם ${equipment}, מנסה בלי סינון ציוד...`);
          r = await queryWorkoutX(searchTerm, null);
        }
        if (!r.ok) {
          debugLog(`⏳ HTTP ${r.status} עבור "${searchTerm}" - כנראה חסימת קצב זמנית, לא שומר כקבוע`, true);
          // Do NOT cache/persist this - it's likely a temporary rate limit, not a real "not found"
          return null;
        }
        if (r.list.length > 0 && r.list[0].gifUrl) {
          debugLog(`✅ נמצא "${r.list[0].name}" עבור "${searchTerm}"`);
          const result = { gifUrl: withKey(r.list[0].gifUrl), matchedName: r.list[0].name };
          mediaCache[cacheKey] = result;
          persistCache();
          return result;
        }
        debugLog(`⚠️ לא נמצא כלום עבור "${searchTerm}"`, true);
        mediaCache[cacheKey] = null;
        persistCache();
        return null;
      } catch (e) {
        debugLog(`❌ שגיאת רשת עבור "${searchTerm}": ${e.message}`, true);
        mediaCache[cacheKey] = null;
        return null;
      }
    }

    // ===== Motivation: weekly goal, totals, achievements, workout log =====
    let stats = JSON.parse(localStorage.getItem('stats') || 'null') || {
      totalCompleted: 0,
      totalExercisesDone: 0,
      weeklyGoal: 3,
      weekStart: null,
      weekCount: 0,
      weeksHitGoal: 0,
      lastCompletedDate: null,
      unlocked: []
    };
    function saveStats() { localStorage.setItem('stats', JSON.stringify(stats)); }

    let workoutLog = JSON.parse(localStorage.getItem('workoutLog') || '[]');
    function saveLog() { localStorage.setItem('workoutLog', JSON.stringify(workoutLog)); }

    function getWeekStart(date) {
      const d = new Date(date);
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - d.getDay()); // week starts Sunday
      return d.toISOString().slice(0, 10);
    }

    const ACHIEVEMENTS = [
      { id: 'first', type: 'workouts', threshold: 1, emoji: '🎉', label: 'האימון הראשון שלך!' },
      { id: 'w5', type: 'workouts', threshold: 5, emoji: '💪', label: '5 אימונים הושלמו' },
      { id: 'w10', type: 'workouts', threshold: 10, emoji: '🏋️', label: '10 אימונים!' },
      { id: 'w25', type: 'workouts', threshold: 25, emoji: '🥇', label: '25 אימונים - מרשים!' },
      { id: 'w50', type: 'workouts', threshold: 50, emoji: '🏆', label: '50 אימונים - אלופה!' },
      { id: 'wk1', type: 'weeks', threshold: 1, emoji: '⭐', label: 'עמדת ביעד השבועי!' },
      { id: 'wk4', type: 'weeks', threshold: 4, emoji: '🌟', label: '4 שבועות ברציפות ביעד!' },
      { id: 'wk12', type: 'weeks', threshold: 12, emoji: '👑', label: '3 חודשים ביעד - מדהים!' }
    ];

    function editWeeklyGoal() {
      const val = prompt('כמה אימונים בשבוע היעד שלך?', stats.weeklyGoal);
      const num = parseInt(val);
      if (num && num > 0) { stats.weeklyGoal = num; saveStats(); renderHomeStats(); }
    }

    function recordCompletion() {
      const today = new Date();
      const todayStr = today.toISOString().slice(0, 10);
      const thisWeekStart = getWeekStart(today);

      if (stats.weekStart !== thisWeekStart) {
        stats.weekStart = thisWeekStart;
        stats.weekCount = 0;
      }

      if (stats.lastCompletedDate !== todayStr) {
        stats.totalCompleted++;
        stats.totalExercisesDone += state.workout.length;
        stats.weekCount++;
        stats.lastCompletedDate = todayStr;
        if (stats.weekCount === stats.weeklyGoal) stats.weeksHitGoal = (stats.weeksHitGoal || 0) + 1;
      }

      const exerciseDetails = state.workout.map(ex => {
        const base = ex.originalId ? EXERCISES.find(e => e.id === ex.originalId) : null;
        return { name: ex.name, areas: (base && base.areas) || [], stretchType: base ? base.stretchType : undefined };
      });
      workoutLog.unshift({ date: todayStr, name: state.workoutName || (editingWorkoutId ? state.savedWorkouts.find(w => w.id === editingWorkoutId)?.name : '') || 'אימון', exerciseCount: state.workout.length, totalSeconds: state.workout.reduce((s, ex) => s + (ex.work || 0) + (ex.rest || 0), 0), exercises: exerciseDetails });
      if (workoutLog.length > 200) workoutLog = workoutLog.slice(0, 200);
      saveLog();

      const newly = [];
      for (const a of ACHIEVEMENTS) {
        if (!stats.unlocked.includes(a.id)) {
          const val = a.type === 'workouts' ? stats.totalCompleted : stats.weeksHitGoal;
          if (val >= a.threshold) { stats.unlocked.push(a.id); newly.push(a); }
        }
      }
      saveStats();
      return newly;
    }

    function showCompleteScreen(newAchievements) {
      showScreen('complete');
      document.getElementById('completeSummary').textContent = `סיימת ${state.workout.length} תרגילים 💥`;
      document.getElementById('completeStreak').textContent = `${stats.weekCount}/${stats.weeklyGoal}`;
      document.getElementById('completeTotal').textContent = stats.totalCompleted;
      const box = document.getElementById('newAchievements');
      box.innerHTML = newAchievements.map(a => `
        <div class="achievement-card"><span class="emoji">${a.emoji}</span>${a.label}</div>
      `).join('');
    }

    function renderHomeStats() {
      const bar = document.getElementById('homeStatsBar');
      if (!bar) return;
      if (stats.totalCompleted === 0) { bar.innerHTML = ''; return; }
      const thisWeekStart = getWeekStart(new Date());
      const weekCount = stats.weekStart === thisWeekStart ? stats.weekCount : 0;
      bar.innerHTML = `
        <div class="stat-pill">📅 השבוע: ${weekCount}/${stats.weeklyGoal} <button onclick="editWeeklyGoal()" style="margin:0 0 0 4px; padding:2px 8px; font-size:0.85em; background:#374151;">✏️</button></div>
        <div class="stat-pill">💪 סה"כ: ${stats.totalCompleted} אימונים</div>
        <div class="stat-pill">📖 <button onclick="showLog()" style="margin:0; padding:0; background:none; color:inherit; font-size:1em;">יומן אימונים</button></div>
      `;
    }

    function showLog() {
      showScreen('log');
      const content = document.getElementById('logContent');
      if (workoutLog.length === 0) {
        content.innerHTML = '<p style="text-align:center; color:#999; padding:30px;">עדיין אין אימונים ביומן</p>';
        return;
      }

      // ===== Aggregate stats across the whole log =====
      const areaCounts = {};
      let dynamicCount = 0, staticCount = 0, totalSeconds = 0;
      workoutLog.forEach(entry => {
        totalSeconds += entry.totalSeconds || 0;
        (entry.exercises || []).forEach(ex => {
          if (ex.stretchType === 'dynamic') dynamicCount++;
          else if (ex.stretchType === 'static') staticCount++;
          (ex.areas || []).forEach(a => { if (a !== 'upper_body') areaCounts[a] = (areaCounts[a] || 0) + 1; });
        });
      });
      const rankedAreas = Object.entries(areaCounts).sort((a, b) => b[1] - a[1]);
      const maxCount = rankedAreas.length ? rankedAreas[0][1] : 1;

      // ===== This week vs last week (total minutes) =====
      const thisWeekStart = getWeekStart(new Date());
      const lastWeekStart = new Date(thisWeekStart);
      lastWeekStart.setDate(lastWeekStart.getDate() - 7);
      const lastWeekStartStr = lastWeekStart.toISOString().slice(0, 10);
      const weekSeconds = (startStr, endStr) => workoutLog.filter(e => e.date >= startStr && e.date < endStr).reduce((s, e) => s + (e.totalSeconds || 0), 0);
      const thisWeekSec = weekSeconds(thisWeekStart, new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10));
      const lastWeekSec = weekSeconds(lastWeekStartStr, thisWeekStart);
      const weekDiff = thisWeekSec - lastWeekSec;

      let html = '<div style="background:#161616; border-radius:10px; padding:14px; margin-bottom:16px;">';
      html += `<p style="font-size:0.9em; color:#93c5fd; margin-bottom:10px;">📊 סה"כ ${workoutLog.length} אימונים · ${formatDuration(totalSeconds)} אימון מצטבר</p>`;

      if (lastWeekSec > 0 || thisWeekSec > 0) {
        const arrow = weekDiff > 0 ? '📈' : weekDiff < 0 ? '📉' : '➡️';
        html += `<p style="font-size:0.85em; color:#ccc; margin-bottom:10px;">${arrow} השבוע: ${formatDuration(thisWeekSec)} (שבוע שעבר: ${formatDuration(lastWeekSec)})</p>`;
      }

      if (rankedAreas.length) {
        html += '<p style="font-size:0.85em; color:#fbbf24; margin-bottom:6px;">💪 איפה הכי התמקדת:</p>';
        html += rankedAreas.slice(0, 6).map(([area, count]) => `
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
            <span style="font-size:0.75em; width:110px; flex-shrink:0;">${AREAS[area] || area}</span>
            <div style="flex:1; background:#222; border-radius:4px; height:10px; overflow:hidden;">
              <div style="width:${Math.round((count / maxCount) * 100)}%; height:100%; background:#7c3aed;"></div>
            </div>
            <span style="font-size:0.75em; color:#999; width:20px; text-align:left;">${count}</span>
          </div>
        `).join('');
      }

      if (dynamicCount || staticCount) {
        html += `<p style="font-size:0.8em; color:#999; margin-top:10px;">🔥 ${dynamicCount} חימומים דינמיים · 🧘 ${staticCount} מתיחות שחרור</p>`;
      }
      html += '</div>';

      // ===== Individual sessions =====
      html += workoutLog.map(entry => {
        const uniqueAreas = [...new Set((entry.exercises || []).flatMap(ex => (ex.areas || []).filter(a => a !== 'upper_body')))];
        const tagsLine = uniqueAreas.length ? uniqueAreas.map(a => AREAS[a] || a).join(' • ') : '';
        return `
        <div class="workout-item">
          <strong>${entry.name}</strong>
          <p style="font-size:0.85em; color:#999; margin-top:4px;">${entry.date} · ${entry.exerciseCount} תרגילים · ${formatTime(entry.totalSeconds)} דקות</p>
          ${tagsLine ? `<p style="font-size:0.75em; color:#7c3aed; margin-top:4px;">${tagsLine}</p>` : ''}
        </div>`;
      }).join('');

      content.innerHTML = html;
    }

    // ===== State =====
    let previewingWorkoutId = null;
    let bulkSelected = new Set();
    let editingWorkoutId = null;
    let state = {
      screen: 'home',
      workoutName: '',
      workout: [],
      savedWorkouts: JSON.parse(localStorage.getItem('workouts') || '[]'),
      isRunning: false,
      currentIdx: 0,
      timeLeft: 0,
      isWorking: true,
      audioCtx: null,
      timer: null
    };

    function playBeep(freq = 800, dur = 200) {
      if (!state.audioCtx) return;
      try {
        const osc = state.audioCtx.createOscillator();
        const gain = state.audioCtx.createGain();
        osc.connect(gain);
        gain.connect(state.audioCtx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.3, state.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, state.audioCtx.currentTime + dur / 1000);
        osc.start(state.audioCtx.currentTime);
        osc.stop(state.audioCtx.currentTime + dur / 1000);
      } catch (e) {}
    }

    function initAudio() {
      if (!state.audioCtx) {
        try { state.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      }
    }

    function switchScreenVisual(name) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(name + 'Screen').classList.add('active');
      state.screen = name;
    }

    function showScreen(name) {
      switchScreenVisual(name);
      history.pushState({ screen: name }, '', '');
    }

    function stopWorkoutMedia() {
      clearInterval(state.timer);
      state.isRunning = false;
      if (currentYtPlayer && currentYtPlayer.destroy) {
        try { currentYtPlayer.destroy(); } catch (e) {}
        currentYtPlayer = null;
      }
      lastMediaKey = null;
    }

    // Makes the phone's physical/gesture back button navigate within the app
    // instead of closing it, by riding the browser's own history stack.
    window.addEventListener('popstate', function (e) {
      const targetScreen = (e.state && e.state.screen) || 'home';
      if (state.screen === 'workout' || state.screen === 'complete') stopWorkoutMedia();
      if (targetScreen === 'home') editingWorkoutId = null;
      switchScreenVisual(targetScreen);
      if (targetScreen === 'home') renderHome();
    });

    function goHome() {
      stopWorkoutMedia();
      editingWorkoutId = null;
      showScreen('home');
      renderHome();
    }

    function clearMediaCache() {
      for (const key in mediaCache) delete mediaCache[key];
      localStorage.removeItem('gifCache');
      preloadStarted = false;
      debugLog('🧹 המטמון נוקה - טוען הכל מחדש...');
      renderBuild();
      preloadGridThumbnails();
    }

    function goToBuild() {
      state.workout = [];
      state.workoutName = '';
      editingWorkoutId = null;
      bulkSelected.clear();
      showScreen('build');
      renderBuild();
      preloadGridThumbnails();
    }

    function editWorkout(id) {
      const w = state.savedWorkouts.find(x => x.id === id);
      if (!w) return;
      state.workout = JSON.parse(JSON.stringify(w.exercises));
      state.workoutName = w.name;
      editingWorkoutId = id;
      bulkSelected.clear();
      showScreen('build');
      renderBuild();
      preloadGridThumbnails();
    }

    let preloadStarted = false;
    async function preloadGridThumbnails() {
      if (preloadStarted) return;
      preloadStarted = true;
      for (const ex of EXERCISES) {
        if (resolveStaticMedia(ex.id)) continue; // hardcoded YouTube or saved fix - no API needed
        const cacheKey = ex.search + '|' + (ex.equipment || '');
        if (mediaCache[cacheKey] === undefined) {
          await fetchExerciseMedia(ex.search, ex.equipment);
          renderBuild();
          await new Promise(r => setTimeout(r, 2200)); // safely under the 30/min rate limit
        }
      }
    }

    async function addExercise(id) {
      const ex = EXERCISES.find(e => e.id === id);
      if (!ex) return;
      let work = 45, rest = 20;
      if (ex.stretchType === 'dynamic') { work = 40; rest = 5; }
      else if (ex.stretchType === 'static') { work = 60; rest = 10; }
      const entry = { id: Date.now() + Math.random(), originalId: ex.id, name: ex.name, search: ex.search, equipment: ex.equipment, work, rest, gifUrl: null, loading: true };
      state.workout.push(entry);
      renderBuild();
      const el = document.getElementById('workout-item-' + entry.id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });

      const staticMedia = resolveStaticMedia(ex.id);
      if (staticMedia) {
        entry.gifUrl = staticMedia.gifUrl;
        entry.youtubeId = staticMedia.youtubeId;
        entry.ytStart = staticMedia.start;
        entry.ytEnd = staticMedia.end;
        entry.loading = false;
        renderBuild();
        return;
      }

      const media = await fetchExerciseMedia(ex.search, ex.equipment);
      entry.gifUrl = media ? media.gifUrl : null;
      entry.loading = false;
      renderBuild();
    }

    let exerciseOverrides = {};
    try { exerciseOverrides = JSON.parse(localStorage.getItem('exerciseOverrides') || '{}'); } catch (e) {}
    function saveOverrides() {
      try { localStorage.setItem('exerciseOverrides', JSON.stringify(exerciseOverrides)); } catch (e) {}
    }

    // ===== YouTube player with precise segment looping =====
    let ytApiReady = false;
    let currentYtPlayer = null;

    function loadYouTubeAPI() {
      if (window.YT || document.getElementById('ytApiScript')) return;
      const tag = document.createElement('script');
      tag.id = 'ytApiScript';
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    }
    window.onYouTubeIframeAPIReady = function () { ytApiReady = true; };
    loadYouTubeAPI();

    async function checkEmbeddable(youtubeId) {
      try {
        const url = `https://www.youtube.com/oembed?url=${encodeURIComponent('https://www.youtube.com/watch?v=' + youtubeId)}&format=json`;
        const res = await fetch(url);
        return res.ok;
      } catch (e) {
        return null; // couldn't verify (network/CORS) - not necessarily blocked
      }
    }

    function playYoutubeLoop(containerId, videoId, start, end) {
      if (currentYtPlayer && currentYtPlayer.destroy) {
        try { currentYtPlayer.destroy(); } catch (e) {}
        currentYtPlayer = null;
      }
      const create = () => {
        const vars = { autoplay: 1, mute: 1, controls: 1, rel: 0, modestbranding: 1, playsinline: 1 };
        if (start) vars.start = start;
        if (end) vars.end = end;
        currentYtPlayer = new YT.Player(containerId, {
          width: '100%',
          height: '100%',
          videoId: videoId,
          playerVars: vars,
          events: {
            onStateChange: function (e) {
              if (e.data === YT.PlayerState.ENDED) {
                currentYtPlayer.seekTo(start || 0);
                currentYtPlayer.playVideo();
              }
            },
            onError: function (e) {
              debugLog(`❌ שגיאת נגן יוטיוב (קוד ${e.data}) - כנראה הטמעה חסומה`, true);
            }
          }
        });
      };
      if (ytApiReady && window.YT && window.YT.Player) {
        create();
      } else {
        const prevCb = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = function () { ytApiReady = true; create(); if (prevCb) prevCb(); };
        loadYouTubeAPI();
      }
    }

    function resolveStaticMedia(originalId) {
      const base = EXERCISES.find(e => e.id === originalId);
      if (base && base.youtubeId) {
        return { youtubeId: base.youtubeId, start: base.start, end: base.end, gifUrl: `https://img.youtube.com/vi/${base.youtubeId}/hqdefault.jpg` };
      }
      if (exerciseOverrides[originalId]) {
        const ov = exerciseOverrides[originalId];
        if (ov.type === 'youtube') {
          return { youtubeId: ov.youtubeId, start: ov.start, end: ov.end, gifUrl: `https://img.youtube.com/vi/${ov.youtubeId}/hqdefault.jpg` };
        }
        return { gifUrl: withKey(ov.gifUrl) };
      }
      return null;
    }

    let manualSearchResults = {};

    function toggleManualSearch(exId) {
      document.getElementById('manualSearch-' + exId).classList.toggle('hidden');
    }

    async function runManualSearch(exId) {
      const input = document.getElementById('manualSearchInput-' + exId);
      const term = input.value.trim();
      if (!term) return;
      const resultsDiv = document.getElementById('manualSearchResults-' + exId);

      const ytMatch = term.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);
      if (ytMatch) {
        const youtubeId = ytMatch[1];
        resultsDiv.innerHTML = '<p style="color:#888; font-size:0.8em;">בודקת אם ניתן להטמיע...</p>';
        const embeddable = await checkEmbeddable(youtubeId);
        if (embeddable === false) {
          resultsDiv.innerHTML = `<p style="color:#f87171; font-size:0.85em;">❌ הבעלים חסם הטמעה של הסרטון הזה. נסי קישור אחר (עדיף לא Shorts).</p>`;
          return;
        }
        resultsDiv.innerHTML = `
          <div style="background:#222; border-radius:8px; padding:10px;">
            ${embeddable === null
              ? '<p style="color:#fbbf24; font-size:0.75em; margin-bottom:6px;">⚠️ לא הצלחתי לוודא מראש - ננסה בכל זאת</p>'
              : '<p style="color:#4ade80; font-size:0.75em; margin-bottom:6px;">✅ ניתן להטמיע</p>'}
            <img src="https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg" style="width:100%; border-radius:6px; margin-bottom:8px;">
            <div style="display:flex; gap:8px; margin-bottom:8px;">
              <div style="flex:1;">
                <label style="font-size:0.75em; color:#999;">התחלה (שנ')</label>
                <input type="number" id="ytStart-${exId}" min="0" placeholder="0" style="width:100%; margin:0;">
              </div>
              <div style="flex:1;">
                <label style="font-size:0.75em; color:#999;">סוף (שנ')</label>
                <input type="number" id="ytEnd-${exId}" min="0" placeholder="עד הסוף" style="width:100%; margin:0;">
              </div>
            </div>
            <button class="success" style="width:100%; margin:0;" onclick="confirmYoutubeSelection(${exId}, '${youtubeId}')">✅ אשר סרטון זה</button>
          </div>`;
        return;
      }

      resultsDiv.innerHTML = '<p style="color:#888; font-size:0.8em;">מחפש...</p>';
      debugLog(`חיפוש ידני: "${term}"...`);
      try {
        const url = `${API_BASE}/exercises?name=${encodeURIComponent(term)}&sortMethod=popularityRank&sortOrder=ascending&limit=6`;
        const res = await fetch(url, { headers: { 'X-WorkoutX-Key': API_KEY } });
        if (!res.ok) {
          resultsDiv.innerHTML = `<p style="color:#f87171; font-size:0.8em;">שגיאה (${res.status}) - נסי שוב בעוד רגע</p>`;
          debugLog(`⏳ חיפוש ידני נכשל: HTTP ${res.status}`, true);
          return;
        }
        const raw = await res.json();
        const list = Array.isArray(raw) ? raw : (Array.isArray(raw.data) ? raw.data : []);
        if (list.length === 0) {
          resultsDiv.innerHTML = '<p style="color:#888; font-size:0.8em;">לא נמצא כלום עבור המילה הזו</p>';
          return;
        }
        manualSearchResults[exId] = list;
        resultsDiv.innerHTML = list.map((item, i) => `
          <div class="search-result" onclick="selectManualResult(${exId}, ${i})">
            <img src="${withKey(item.gifUrl)}" alt="${item.name}">
            <span>${item.name}</span>
          </div>
        `).join('');
      } catch (e) {
        resultsDiv.innerHTML = `<p style="color:#f87171; font-size:0.8em;">שגיאת רשת: ${e.message}</p>`;
      }
    }

    function confirmYoutubeSelection(exId, youtubeId) {
      const startInput = document.getElementById('ytStart-' + exId);
      const endInput = document.getElementById('ytEnd-' + exId);
      const start = startInput && startInput.value ? parseInt(startInput.value) : null;
      const end = endInput && endInput.value ? parseInt(endInput.value) : null;
      const ex = state.workout.find(e => e.id === exId);
      if (ex) {
        ex.youtubeId = youtubeId;
        ex.ytStart = start;
        ex.ytEnd = end;
        ex.gifUrl = `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`;
        ex.loading = false;
        if (ex.originalId) {
          exerciseOverrides[ex.originalId] = { type: 'youtube', youtubeId, start, end };
          saveOverrides();
          debugLog(`💾 נשמר סרטון יוטיוב (קטע ${start || 0}-${end || 'סוף'}) עבור ${ex.name}`);
        }
        document.getElementById('manualSearch-' + exId).classList.add('hidden');
        renderBuild();
      }
    }

    function selectManualResult(exId, idx) {
      const item = manualSearchResults[exId][idx];
      const ex = state.workout.find(e => e.id === exId);
      if (ex && item) {
        ex.gifUrl = withKey(item.gifUrl);
        ex.loading = false;
        if (ex.originalId) {
          exerciseOverrides[ex.originalId] = { type: 'gif', gifUrl: item.gifUrl, matchedName: item.name };
          saveOverrides();
          debugLog(`💾 נשמר לצמיתות כברירת מחדל: "${item.name}" עבור ${ex.name}`);
        }
        document.getElementById('manualSearch-' + exId).classList.add('hidden');
        renderBuild();
      }
    }

    let draggedId = null;

    function onDragStart(e, id) {
      draggedId = id;
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(id)); } catch (err) {}
      const card = document.getElementById('workout-item-' + id);
      if (card) card.classList.add('dragging');
    }

    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('.workout-item.drag-over').forEach(el => el.classList.remove('drag-over'));
      e.currentTarget.classList.add('drag-over');
    }

    function onDrop(e, targetId) {
      e.preventDefault();
      document.querySelectorAll('.workout-item.drag-over').forEach(el => el.classList.remove('drag-over'));
      if (draggedId === null || draggedId === targetId) return;
      const fromIdx = state.workout.findIndex(x => x.id === draggedId);
      const toIdx = state.workout.findIndex(x => x.id === targetId);
      if (fromIdx === -1 || toIdx === -1) return;
      const [moved] = state.workout.splice(fromIdx, 1);
      state.workout.splice(toIdx, 0, moved);
      const movedId = draggedId;
      renderBuild();
      const el = document.getElementById('workout-item-' + movedId);
      if (el) {
        el.classList.add('just-moved');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => el.classList.remove('just-moved'), 800);
      }
    }

    function onDragEnd(e) {
      document.querySelectorAll('.workout-item.dragging, .workout-item.drag-over').forEach(el => el.classList.remove('dragging', 'drag-over'));
      draggedId = null;
    }

    function moveExercise(id, direction) {
      const idx = state.workout.findIndex(e => e.id === id);
      const newIdx = idx + direction;
      if (idx === -1 || newIdx < 0 || newIdx >= state.workout.length) return;
      [state.workout[idx], state.workout[newIdx]] = [state.workout[newIdx], state.workout[idx]];
      renderBuild();
      const el = document.getElementById('workout-item-' + id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('just-moved');
        setTimeout(() => el.classList.remove('just-moved'), 800);
      }
    }

    function removeExercise(id) {
      state.workout = state.workout.filter(e => e.id !== id);
      bulkSelected.delete(id);
      renderBuild();
    }

    function toggleBulkSelect(id) {
      if (bulkSelected.has(id)) bulkSelected.delete(id); else bulkSelected.add(id);
      renderBuild();
    }

    function clearBulkSelect() {
      bulkSelected.clear();
      renderBuild();
    }

    function moveSelectedBlock(direction) {
      if (bulkSelected.size === 0) return;
      const arr = state.workout;
      if (direction === -1) {
        for (let i = 1; i < arr.length; i++) {
          if (bulkSelected.has(arr[i].id) && !bulkSelected.has(arr[i - 1].id)) {
            [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
          }
        }
      } else {
        for (let i = arr.length - 2; i >= 0; i--) {
          if (bulkSelected.has(arr[i].id) && !bulkSelected.has(arr[i + 1].id)) {
            [arr[i], arr[i + 1]] = [arr[i + 1], arr[i]];
          }
        }
      }
      renderBuild();
    }

    function updateTime(id, field, value) {
      const ex = state.workout.find(e => e.id === id);
      if (ex) { ex[field] = parseInt(value) || 0; }
      updateTotalTimeBuild();
    }

    function applyBulkTimes() {
      const workInput = document.getElementById('bulkWork');
      const restInput = document.getElementById('bulkRest');
      const workVal = workInput.value ? parseInt(workInput.value) : null;
      const restVal = restInput.value ? parseInt(restInput.value) : null;
      if (!workVal && restVal === null) { alert('מלאי לפחות שדה אחד'); return; }
      const targets = bulkSelected.size > 0 ? state.workout.filter(ex => bulkSelected.has(ex.id)) : state.workout;
      targets.forEach(ex => {
        if (workVal) ex.work = workVal;
        if (restVal !== null) ex.rest = restVal;
      });
      workInput.value = '';
      restInput.value = '';
      renderBuild();
    }

    function updateTotalTimeBuild() {
      const el = document.getElementById('totalTimeBuild');
      if (!el) return;
      const total = state.workout.reduce((sum, ex) => sum + (ex.work || 0) + (ex.rest || 0), 0);
      el.textContent = state.workout.length ? `⏱️ זמן כולל: ${formatTime(total)} דקות` : '';
      const titleEl = document.getElementById('buildTitle');
      if (titleEl) titleEl.textContent = editingWorkoutId ? 'עריכת רוטינה' : 'בניית רוטינה';

      const applyBtn = document.getElementById('bulkApplyBtn');
      const selBar = document.getElementById('bulkSelectionBar');
      if (applyBtn && selBar) {
        if (bulkSelected.size > 0) {
          applyBtn.textContent = `החל על ${bulkSelected.size} נבחרים`;
          selBar.classList.remove('hidden');
          document.getElementById('bulkSelectionCount').textContent = `${bulkSelected.size} נבחרו:`;
        } else {
          applyBtn.textContent = 'החל על הכל';
          selBar.classList.add('hidden');
        }
      }
    }

    function clearWorkout() {
      state.workout = [];
      renderBuild();
    }

    function saveWorkout() {
      if (!state.workoutName.trim()) { alert('תן שם לרוטינה!'); return; }
      if (state.workout.length === 0) { alert('בחר לפחות תרגיל אחד!'); return; }
      if (editingWorkoutId) {
        const idx = state.savedWorkouts.findIndex(w => w.id === editingWorkoutId);
        if (idx !== -1) {
          state.savedWorkouts[idx] = { id: editingWorkoutId, name: state.workoutName, exercises: JSON.parse(JSON.stringify(state.workout)) };
        }
        editingWorkoutId = null;
      } else {
        const w = { id: Date.now(), name: state.workoutName, exercises: JSON.parse(JSON.stringify(state.workout)) };
        state.savedWorkouts.push(w);
      }
      localStorage.setItem('workouts', JSON.stringify(state.savedWorkouts));
      goHome();
    }

    function loadWorkout(id) {
      const w = state.savedWorkouts.find(x => x.id === id);
      if (w) {
        state.workout = JSON.parse(JSON.stringify(w.exercises));
        state.currentIdx = 0;
        state.isRunning = false;
        state.isWorking = true;
        state.timeLeft = 0;
        showScreen('workout');
        loadExerciseMedia();
        renderWorkout();
      }
    }

    function previewWorkout(id) {
      const w = state.savedWorkouts.find(x => x.id === id);
      if (!w) return;
      previewingWorkoutId = id;
      showScreen('preview');
      document.getElementById('previewTitle').textContent = w.name;
      const total = w.exercises.reduce((sum, ex) => sum + (ex.work || 0) + (ex.rest || 0), 0);
      document.getElementById('previewMeta').textContent = `${w.exercises.length} תרגילים · ⏱️ ${formatTime(total)} דקות`;
      document.getElementById('previewList').innerHTML = w.exercises.map((ex, idx) => `
        <div class="workout-item">
          <div class="workout-item-header">
            ${ex.gifUrl ? `<img src="${ex.gifUrl}" alt="${ex.name}">` : '<div class="thumb-placeholder">אין<br>תמונה</div>'}
            <div class="name"><strong>${idx + 1}. ${ex.name}</strong></div>
          </div>
          <p style="font-size:0.8em; color:#999;">עבודה ${ex.work} שנ' · מנוחה ${ex.rest} שנ'</p>
        </div>
      `).join('');
    }

    function deleteWorkout(id) {
      state.savedWorkouts = state.savedWorkouts.filter(w => w.id !== id);
      localStorage.setItem('workouts', JSON.stringify(state.savedWorkouts));
      renderHome();
    }

    // Loads (and caches) the gifUrl for the CURRENT exercise. Does not touch the DOM directly -
    // renderMedia() decides what to actually show based on work/rest state.
    async function loadExerciseMedia() {
      const current = state.workout[state.currentIdx];
      if (!current.gifUrl) {
        const staticMedia = current.originalId ? resolveStaticMedia(current.originalId) : null;
        if (staticMedia) {
          current.gifUrl = staticMedia.gifUrl;
          current.youtubeId = staticMedia.youtubeId;
          current.ytStart = staticMedia.start;
          current.ytEnd = staticMedia.end;
        } else {
          const media = await fetchExerciseMedia(current.search, current.equipment);
          current.gifUrl = media ? media.gifUrl : null;
        }
      }
      renderMedia(true);
      // Prefetch the next exercise in the background so its thumbnail is ready in time
      const next = state.workout[state.currentIdx + 1];
      if (next && !next.gifUrl) {
        const staticMedia = next.originalId ? resolveStaticMedia(next.originalId) : null;
        if (staticMedia) {
          next.gifUrl = staticMedia.gifUrl;
          next.youtubeId = staticMedia.youtubeId;
          next.ytStart = staticMedia.start;
          next.ytEnd = staticMedia.end;
        } else {
          fetchExerciseMedia(next.search, next.equipment).then(media => {
            next.gifUrl = media ? media.gifUrl : null;
          });
        }
      }
    }

    let lastMediaKey = null;
    function renderMedia(force) {
      const current = state.workout[state.currentIdx];
      const key = state.currentIdx + '-' + state.isWorking + '-' + (current.gifUrl || 'x');
      if (!force && key === lastMediaKey) return;
      lastMediaKey = key;

      const wrap = document.getElementById('mediaWrap');
      const nextBox = document.getElementById('nextUpBox');
      nextBox.classList.add('hidden'); // replaced by the big rest-screen preview below

      if (currentYtPlayer && currentYtPlayer.destroy) {
        try { currentYtPlayer.destroy(); } catch (e) {}
        currentYtPlayer = null;
      }

      if (!state.isWorking) {
        const next = state.currentIdx < state.workout.length - 1 ? state.workout[state.currentIdx + 1] : null;
        if (next && next.youtubeId) {
          wrap.innerHTML = `
            <div id="ytPlayerHost" style="position:absolute;inset:0;"></div>
            <div style="position:absolute; top:0; left:0; right:0; z-index:5; text-align:center; padding:16px; background:linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);">
              <p style="font-size:1.05em; margin-bottom:4px;">😌 מנוחה</p>
              <p style="font-size:0.85em; color:#fbbf24;">👉 מתכוננים ל: ${next.name}</p>
            </div>`;
          playYoutubeLoop('ytPlayerHost', next.youtubeId, next.ytStart, next.ytEnd);
        } else if (next) {
          wrap.innerHTML = `
            <div class="rest-screen">
              <p style="font-size:1.1em; margin-bottom:8px;">😌 מנוחה</p>
              <p style="font-size:0.85em; color:#fbbf24; margin-bottom:8px;">👉 מתכוננים לתרגיל הבא:</p>
              ${next.gifUrl ? `<img src="${next.gifUrl}" alt="${next.name}" style="max-width:65%; max-height:45vh; border-radius:14px; border:2px solid #fbbf24;">` : ''}
              <p style="font-size:1.3em; font-weight:bold; margin-top:10px;">${next.name}</p>
            </div>`;
        } else {
          wrap.innerHTML = `<div class="rest-screen"><div class="big-emoji">🎉</div><p>כמעט סיימת!</p></div>`;
        }
      } else if (current.youtubeId) {
        wrap.innerHTML = '<div id="ytPlayerHost" style="position:absolute;inset:0;"></div>';
        playYoutubeLoop('ytPlayerHost', current.youtubeId, current.ytStart, current.ytEnd);
      } else if (current.gifUrl) {
        wrap.innerHTML = `<img src="${current.gifUrl}" alt="${current.name}">`;
      } else if (current.loading !== false) {
        wrap.innerHTML = '<div class="media-fallback">טוען...</div>';
      } else {
        const base = current.originalId ? EXERCISES.find(e => e.id === current.originalId) : null;
        if (base && base.instructions) {
          wrap.innerHTML = `<div class="media-fallback" style="text-align:right; max-width:85%; line-height:1.6;">📋 <strong>${current.name}</strong><br><br>${base.instructions}</div>`;
        } else {
          wrap.innerHTML = '<div class="media-fallback">😕 אין סרטון או הוראות לתרגיל הזה<br>(פתחי את 🐞 לפרטים)</div>';
        }
      }
    }

    function tick() {
      if (state.timeLeft <= 3 && state.timeLeft > 0) {
        playBeep(state.timeLeft === 3 ? 600 : state.timeLeft === 2 ? 700 : 800, 150);
      } else if (state.isWorking && state.timeLeft > 3) {
        // Soft rhythmic pulse during active work, to signal "keep going" - silent during rest.
        playBeep(220, 60);
      }

      if (state.timeLeft <= 1) {
        if (state.isWorking) {
          state.isWorking = false;
          playBeep(1000, 200);
          state.timeLeft = state.workout[state.currentIdx].rest;
        } else {
          if (state.currentIdx < state.workout.length - 1) {
            state.currentIdx++;
            state.isWorking = true;
            playBeep(1200, 200);
            state.timeLeft = state.workout[state.currentIdx].work;
            loadExerciseMedia();
          } else {
            state.isRunning = false;
            clearInterval(state.timer);
            playBeep(1200, 300);
            const newAchievements = recordCompletion();
            showCompleteScreen(newAchievements);
            return;
          }
        }
      } else {
        state.timeLeft--;
      }
      renderWorkout();
    }

    function toggleWorkout() {
      if (!state.isRunning) {
        if (state.timeLeft === 0) {
          // Fresh start only - not a resume after pause
          state.isWorking = true;
          state.currentIdx = 0;
          state.timeLeft = state.workout[0].work;
          loadExerciseMedia();
        }
        state.isRunning = true;
        state.timer = setInterval(tick, 1000);
      } else {
        state.isRunning = false;
        clearInterval(state.timer);
      }
      renderWorkout();
    }

    function restartCurrentExercise() {
      const current = state.workout[state.currentIdx];
      state.timeLeft = state.isWorking ? current.work : current.rest;
      renderWorkout();
    }

    function toggleFullList() {
      const overlay = document.getElementById('fullListOverlay');
      overlay.classList.toggle('hidden');
      if (!overlay.classList.contains('hidden')) renderFullList();
    }

    function renderFullList() {
      const content = document.getElementById('fullListContent');
      content.innerHTML = state.workout.map((ex, idx) => `
        <div class="full-list-item ${idx === state.currentIdx ? 'current' : idx < state.currentIdx ? 'done' : ''}">
          <span>${idx + 1}. ${ex.name}</span>
          ${idx === state.currentIdx ? '<span>◀ עכשיו</span>' : idx < state.currentIdx ? '<span>✓</span>' : ''}
        </div>
      `).join('');
    }

    function skipPhase() {
      if (state.isWorking) {
        state.isWorking = false;
        playBeep(1000, 200);
        state.timeLeft = state.workout[state.currentIdx].rest;
      } else {
        if (state.currentIdx < state.workout.length - 1) {
          state.currentIdx++;
          state.isWorking = true;
          playBeep(1200, 200);
          state.timeLeft = state.workout[state.currentIdx].work;
          loadExerciseMedia();
        } else {
          state.isRunning = false;
          clearInterval(state.timer);
          const newAchievements = recordCompletion();
          showCompleteScreen(newAchievements);
          return;
        }
      }
      renderWorkout();
    }

    function resetWorkout() {
      clearInterval(state.timer);
      state.isRunning = false;
      state.currentIdx = 0;
      state.isWorking = true;
      state.timeLeft = 0;
      loadExerciseMedia();
      renderWorkout();
    }

    function renderHome() {
      renderHomeStats();
      const list = document.getElementById('workoutsList');
      if (state.savedWorkouts.length === 0) {
        list.innerHTML = '<p style="text-align: center; padding: 30px; color:#999;">עדיין אין רוטינות</p>';
      } else {
        list.innerHTML = state.savedWorkouts.map(w => `
          <div class="workout-card">
            <h3>${w.name}</h3>
            <p>${w.exercises.length} תרגילים</p>
            <div class="button-group">
              <button onclick="previewWorkout(${w.id})" style="background:#374151;">👁️ תצוגה</button>
              <button class="success" onclick="loadWorkout(${w.id})" style="flex: 1;">▶️ התחל</button>
              <button class="danger" onclick="deleteWorkout(${w.id})">🗑️</button>
            </div>
          </div>
        `).join('');
      }
    }

    let selectedAreas = new Set();
    let selectedPositions = new Set();
    let selectedStretchTypes = new Set();
    let filtersPopulated = false;

    function populateFilters() {
      if (filtersPopulated) return;
      filtersPopulated = true;
      const areaContainer = document.getElementById('areaChips');
      const posContainer = document.getElementById('positionChips');
      const stretchContainer = document.getElementById('stretchChips');
      areaContainer.innerHTML = Object.keys(AREAS).map(key =>
        `<button type="button" class="chip" id="chip-area-${key}" onclick="toggleFilter('area','${key}')">${AREAS[key]}</button>`
      ).join('');
      posContainer.innerHTML = Object.keys(POSITIONS).map(key =>
        `<button type="button" class="chip" id="chip-pos-${key}" onclick="toggleFilter('pos','${key}')">${POSITIONS[key]}</button>`
      ).join('');
      stretchContainer.innerHTML = Object.keys(STRETCH_TYPES).map(key =>
        `<button type="button" class="chip" id="chip-stretch-${key}" onclick="toggleFilter('stretch','${key}')">${STRETCH_TYPES[key]}</button>`
      ).join('');
    }

    function toggleFilter(type, key) {
      const set = type === 'area' ? selectedAreas : type === 'pos' ? selectedPositions : selectedStretchTypes;
      if (set.has(key)) set.delete(key); else set.add(key);
      const btn = document.getElementById(`chip-${type}-${key}`);
      if (btn) btn.classList.toggle('active');
      renderBuild();
    }

    function clearFilters() {
      selectedAreas.clear();
      selectedPositions.clear();
      selectedStretchTypes.clear();
      document.querySelectorAll('.chip.active').forEach(el => el.classList.remove('active'));
      renderBuild();
    }

    function renderBuild() {
      populateFilters();
      const grid = document.getElementById('exercisesGrid');
      const filtered = EXERCISES.filter(ex =>
        (selectedAreas.size === 0 || (ex.areas && ex.areas.some(a => selectedAreas.has(a)))) &&
        (selectedPositions.size === 0 || (ex.positions && ex.positions.some(p => selectedPositions.has(p)))) &&
        (selectedStretchTypes.size === 0 || selectedStretchTypes.has(ex.stretchType))
      );
      grid.innerHTML = (filtered.length ? filtered : []).map(ex => {
        let thumb;
        if (resolveStaticMedia(ex.id)) {
          thumb = `<img src="${resolveStaticMedia(ex.id).gifUrl}" alt="${ex.name}">`;
        } else {
          const cacheKey = ex.search + '|' + (ex.equipment || '');
          const cached = mediaCache[cacheKey];
          thumb = cached === undefined
            ? '<div class="thumb-empty">⏳</div>'
            : (cached && cached.gifUrl ? `<img src="${cached.gifUrl}" alt="${ex.name}">` : '<div class="thumb-empty">🚫</div>');
        }
        const badge = ex.stretchType === 'dynamic' ? '🔥' : ex.stretchType === 'static' ? '🧘' : '';
        return `<button onclick="addExercise(${ex.id})" class="exercise-btn">${thumb}<span>${badge} ${ex.name}</span></button>`;
      }).join('') || '<p style="grid-column:1/-1; text-align:center; color:#999; padding:15px;">אין תרגילים בקטגוריה הזו</p>';

      const selected = document.getElementById('selectedExercises');
      if (state.workout.length === 0) {
        selected.innerHTML = '<p style="text-align: center; color: #999;">בחירת תרגילים למעלה</p>';
      } else {
        selected.innerHTML = state.workout.map((ex, idx) => `
          <div class="workout-item ${bulkSelected.has(ex.id) ? 'bulk-selected' : ''}" id="workout-item-${ex.id}" ondragover="onDragOver(event)" ondrop="onDrop(event, ${ex.id})">
            <div class="workout-item-header">
              <input type="checkbox" onchange="toggleBulkSelect(${ex.id})" ${bulkSelected.has(ex.id) ? 'checked' : ''} style="width:20px; height:20px; margin:0; flex-shrink:0;">
              <span class="drag-handle" draggable="true" ondragstart="onDragStart(event, ${ex.id})" ondragend="onDragEnd(event)">⠿</span>
              ${ex.loading
                ? '<div class="thumb-placeholder">טוען</div>'
                : (ex.gifUrl ? `<img src="${ex.gifUrl}" alt="${ex.name}">` : '<div class="thumb-placeholder">אין<br>סרטון</div>')}
              <div class="name"><strong>${idx + 1}. ${ex.name}</strong></div>
              <div style="display:flex; flex-direction:column; gap:3px;">
                <button onclick="moveExercise(${ex.id}, -1)" ${idx === 0 ? 'disabled style="margin:0;opacity:0.3;"' : 'style="margin:0;background:#374151;padding:4px 10px;"'}>▲</button>
                <button onclick="moveExercise(${ex.id}, 1)" ${idx === state.workout.length - 1 ? 'disabled style="margin:0;opacity:0.3;"' : 'style="margin:0;background:#374151;padding:4px 10px;"'}>▼</button>
              </div>
              <button onclick="toggleManualSearch(${ex.id})" style="margin:0; background:#374151; padding:8px;">🔍</button>
              <button class="danger" onclick="removeExercise(${ex.id})" style="margin: 0;">🗑️</button>
            </div>
            <div id="manualSearch-${ex.id}" class="manual-search hidden">
              <input type="text" id="manualSearchInput-${ex.id}" placeholder="נסי מילה אחרת, למשל: overhead carry">
              <button onclick="runManualSearch(${ex.id})" class="success" style="width:100%; margin:6px 0;">חפש</button>
              <div id="manualSearchResults-${ex.id}"></div>
            </div>
            <div class="times">
              <div class="time-input">
                <label>עבודה (שנ')</label>
                <input type="number" value="${ex.work}" onchange="updateTime(${ex.id}, 'work', this.value)" min="1">
              </div>
              <div class="time-input">
                <label>מנוחה (שנ')</label>
                <input type="number" value="${ex.rest}" onchange="updateTime(${ex.id}, 'rest', this.value)" min="0">
              </div>
            </div>
          </div>
        `).join('');
      }

      const nameInput = document.getElementById('workoutNameInput');
      if (nameInput) nameInput.value = state.workoutName;
      updateTotalTimeBuild();
    }

    function renderWorkout() {
      const current = state.workout[state.currentIdx];
      document.getElementById('exerciseName').textContent = current.name;
      document.getElementById('exerciseNumber').textContent = `תרגיל ${state.currentIdx + 1}/${state.workout.length}`;

      const mins = Math.floor(state.timeLeft / 60);
      const secs = state.timeLeft % 60;
      document.getElementById('timerDisplay').textContent =
        String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');

      document.getElementById('workingEmoji').textContent = state.isWorking ? '🔥' : '😤';

      const progress = ((state.currentIdx + 1) / state.workout.length) * 100;
      document.getElementById('progressFill').style.width = progress + '%';

      document.getElementById('startBtn').textContent = state.isRunning ? '⏸️ עצור' : '▶️ התחל';

      let totalLeft = state.timeLeft;
      if (state.isWorking) totalLeft += current.rest;
      for (let i = state.currentIdx + 1; i < state.workout.length; i++) {
        totalLeft += state.workout[i].work + state.workout[i].rest;
      }
      document.getElementById('totalTimeLeft').textContent = `⏱️ נשאר סה"כ: ${formatTime(totalLeft)}`;

      if (!document.getElementById('fullListOverlay').classList.contains('hidden')) renderFullList();

      renderMedia();
    }

    document.addEventListener('click', initAudio, { once: true });
    history.replaceState({ screen: 'home' }, '', '');
    switchScreenVisual('home');
    renderHome();
  </script>
</body>
</html>
